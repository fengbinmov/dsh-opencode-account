# dsh-opencode-account bundle layer.
#
# Two rows:
#
#   1. `llm-pi-ai` — the provider route(s) for OpenCode Go. pi-ai already ships
#      the `opencode-go` catalog, but it drifts from the live subscription, and
#      the gateway demands a header neither pi-ai nor dsh generates
#      (`x-opencode-session`; without it every request is `400 MissingSessionID`).
#
#      Read the generated `providers` block below before editing it: the route
#      set is one route PER WIRE PROTOCOL, because a `models` entry has no `api`
#      field and dsh takes the protocol from the route. Regenerate rather than
#      hand-edit:
#
#        node scripts/build-provider-models.mjs
#
#      The same section also lives in `$DSH_HOME/settings.yaml` (the file the web
#      Models page writes, which wins over this layer) — the script keeps both in
#      step.
#
#   2. `opencode-account` — the account page. `name` must be the FULL package
#      specifier as installed in the profile's `node_modules` (the loader
#      imports it as a module), and a YAML scalar starting with `@` must be
#      quoted or the document fails to parse.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # >>> generated by scripts/build-provider-models.mjs — do not hand-edit
